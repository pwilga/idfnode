              {{ state_attr('sensor.neocikon_app_build_time','version') }} IDF:
              {{ state_attr('sensor.neocikon_app_build_time','idf') }}
              {% endif %}
            icon: mdi:application-brackets-outline
            grid_options:
              columns: 6
              rows: auto
            features_position: bottom
            color: orange
            entity: sensor.neocikon_app_build_time
        background:
          opacity: 24
