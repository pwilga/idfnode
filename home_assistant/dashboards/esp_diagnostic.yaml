views:
  - title: ESP Dev Dashboard
    icon: mdi:chip
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: markdown
            content: |-
              {%- set temp = states('sensor.neocikon_chip_temp') -%}
              {%- if temp not in ['unknown', 'unavailable', none, ''] -%}
              {{ 'Chip temp.: %.2f' | format(temp | float) }}°C
              {%- endif -%}<br>
              {%- set host = states('sensor.neocikon_mdns') -%}
              {%- if host not in ['unknown', 'unavailable', none, ''] -%}
              [http://{{ host }}](http://{{ host }})
              {%- endif -%}
            grid_options:
              columns: 6
              rows: 1
            text_only: true
            card_mod:
              style:
                .: |
                  ha-card {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    height: 100%;
                  }
                  ha-markdown {
                    text-align: center;
                  }
          - type: custom:mushroom-title-card
            title: neocikon
            grid_options:
              rows: 2
              columns: 6
            alignment: end
            subtitle: >-
              {%- set id = states('sensor.neocikon_id') -%}
              {%- set boot = states('sensor.neocikon_boot_time') -%}
              {%- set id_line = id if id not in ['unknown', 'unavailable', '']
              else '' -%}
              {%- set up_line = ('Uptime: ' ~
              relative_time(as_datetime(boot))) if boot not in ['unknown',
              'unavailable', ''] else '' -%}
              {{ [id_line, up_line] | reject('equalto', '') | list | join('\n') }}
            title_tap_action:
              action: none
          - type: markdown
            content: >-
              {%- set icons = {
                'wifi': {'icon': 'mdi:wifi', 'color': '#8bc34a'},
                'bt':   {'icon': 'mdi:bluetooth', 'color': '#2979ff'},
                'ble':  {'icon': 'mdi:bluetooth-connect', 'color': '#2979ff'},
                'ieee802154': {'icon': 'mdi:radio-tower', 'color': '#ffff00'},
              } -%} {%- if not is_state('sensor.neocikon_chip', 'unavailable')
              -%} {%- for f in state_attr('sensor.neocikon_chip','features')
              -%} {%- set d
              = icons.get(f, {'icon': 'mdi:help-circle-outline', 'color':
              'grey'}) -%} <font
              color="{{ d.color }}"><ha-icon icon="{{ d.icon
              }}"></ha-icon></font> {%-
              endfor -%} {%- endif -%}
            grid_options:
              columns: 6
              rows: 1
            text_only: true
            card_mod:
              style:
                .: |
                  ha-card {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    height: 100%;
                  }
                  ha-markdown {
                    text-align: center;
                  }
                ha-markdown$: |
                  ha-icon {
                    --mdc-icon-size: 18px;
                    margin-right: 4px;
                    padding: 5px;
                    box-sizing: border-box;
                  }
                  ha-icon {
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    width: 32px;
                    height: 32px;
                    box-sizing: border-box;
                    border-radius: 50%;
                    background: rgba(255,255,255,0.1);
                    overflow: hidden;
                  }
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                entity: sensor.neocikon_chip
                icon: mdi:cpu-32-bit
                icon_color: blue
                content: >-
                  {% set v = states('sensor.neocikon_chip') %}
                  {{ '--' if v in ['unknown', 'unavailable'] else v }}
                tap_action:
                  action: none
              - type: template
                entity: sensor.neocikon_chip
                icon: mdi:harddisk
                icon_color: amber
                content: >-
                  {% set fs = state_attr('sensor.neocikon_chip', 'flash_size') %}
                  Flash: {{ '--' if fs is none else
                  ((fs | int(0) / 1048576) | round(0) ~ ' MB') }}
                tap_action:
                  action: none
              - type: template
                entity: sensor.neocikon_chip
                icon: mdi:speedometer
                icon_color: orange
                content: >-
                  {% set cf = state_attr('sensor.neocikon_chip', 'cpu_freq') %}
                  CPU: {{ '--' if cf is none else (cf ~ ' MHz') }}
                tap_action:
                  action: none
              - type: template
                entity: sensor.neocikon_chip
                icon: mdi:chip
                icon_color: dark-grey
                content: >-
                  {% set c = state_attr('sensor.neocikon_chip', 'cores') %}
                  {{ 'Cores: --' if c is none else
                  ('Core: 1' if c == 1 else 'Cores: ' ~ c) }}
                tap_action:
                  action: none
              - type: action
                icon_color: pink
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.neocikon_restart
                  data: {}
                  confirmation:
                    text: Restart?
                icon: mdi:restart
            alignment: center
          - type: custom:mushroom-template-card
            entity: sensor.neocikon_ip
            layout: horizontal
            multiline_secondary: true
            primary: >
              {% set link = states('sensor.neocikon_link') %}

              Uplink: {{ link if link not in ['unknown', 'unavailable', ''] else
              '--' }}
            secondary: >
              {%- set ip = states('sensor.neocikon_ip') -%}
              {%- set ssid = state_attr('sensor.neocikon_link', 'ssid') -%}
              {%- set rssi = state_attr('sensor.neocikon_link', 'rssi') -%}
              {%- set link_line = (ssid if ssid else '') ~ ((' (' ~ rssi ~ '
              dBm)') if rssi else '') -%}
              {%- set reset_reason = states('sensor.neocikon_reset_reason') -%}
              {%- set ota_state = states('sensor.neocikon_ota_state') -%}
              IP: {{ (ip if ip not in ['unknown', 'unavailable', ''] else '--') |
              truncate(22, True, '…') }}

              {{ (link_line ~ '\n') if link_line else '' }}Reset: {{
              reset_reason if reset_reason not in ['unknown', 'unavailable', '']
              else '--' }}

              {{ ota_state if ota_state not in ['unknown', 'unavailable', '']
              else '--' }}
            icon: mdi:cpu-32-bit
            icon_color: purple
            grid_options:
              columns: 6
              rows: 2
          - type: custom:mushroom-template-card
            entity: sensor.neocikon_dram
            primary: >-
              {{ (state_attr('sensor.neocikon_dram','dram_free') | int(0) /
              1024) | round(0) | int }} KB free ({{
              (state_attr('sensor.neocikon_dram','dram_min_free') | int(0) / 1024) |
              round(0) | int }} KB)
            secondary: >-
              DRAM {{ (state_attr('sensor.neocikon_dram','dram_size') | int(0) / 1024) |
              round(0) | int }} KB · {{ states('sensor.neocikon_dram') | float(0) |
              round(0) | int }}% used
            icon: mdi:memory
            icon_color: >-
              {% set p = states('sensor.neocikon_dram') | float(0) %} {{ 'red' if p > 85
              else 'amber' if p > 60 else 'teal' }}
            grid_options:
              columns: 6
              rows: auto
            card_mod:
              style: |
                ha-card {
                  position: relative;
                  overflow: hidden;
                }
                ha-card::before {
                  content: "";
                  position: absolute;
                  left: 0;
                  top: 0;
                  bottom: 0;
                  width: 100%;
                  clip-path: inset(0 {{ 100 - (states('sensor.neocikon_dram') | float(0)) }}% 0 0);
                  background: {% set p = states('sensor.neocikon_dram') | float(0) %}{{ 'linear-gradient(90deg, rgba(244, 67, 54, 0.25), rgba(233, 30, 99, 0.25))' if p > 85 else 'linear-gradient(90deg, rgba(255, 152, 0, 0.25), rgba(255, 193, 7, 0.25))' if p > 60 else 'linear-gradient(90deg, rgba(0, 150, 136, 0.25), rgba(76, 175, 80, 0.25))' }};
                  z-index: 0;
                  transition: clip-path 1s ease;
                }
                ha-card > * {
                  position: relative;
                  z-index: 1;
                }
          - type: custom:mushroom-template-card
            entity: sensor.neocikon_fs
            primary: >-
              {{ ((state_attr('sensor.neocikon_fs','fs_size') | int(0) -
              state_attr('sensor.neocikon_fs','fs_used') | int(0)) / 1024) | round(0) | int }}
              KB free
            secondary: >-
              FS {{ (state_attr('sensor.neocikon_fs','fs_size') | int(0) / 1024) |
              round(0) | int }} KB · {{ states('sensor.neocikon_fs') | float(0) |
              round(0) | int }}% used
            icon: mdi:harddisk
            icon_color: >-
              {% set p = states('sensor.neocikon_fs') | float(0) %} {{ 'red' if p > 85
              else 'amber' if p > 60 else 'deep-purple' }}
            grid_options:
              columns: 6
              rows: auto
            card_mod:
              style: |
                ha-card {
                  position: relative;
                  overflow: hidden;
                }
                ha-card::before {
                  content: "";
                  position: absolute;
                  left: 0;
                  top: 0;
                  bottom: 0;
                  width: 100%;
                  clip-path: inset(0 {{ 100 - (states('sensor.neocikon_fs') | float(0)) }}% 0 0);
                  background: {% set p = states('sensor.neocikon_fs') | float(0) %}{{ 'linear-gradient(90deg, rgba(244, 67, 54, 0.25), rgba(233, 30, 99, 0.25))' if p > 85 else 'linear-gradient(90deg, rgba(255, 152, 0, 0.25), rgba(255, 193, 7, 0.25))' if p > 60 else 'linear-gradient(90deg, rgba(103, 58, 183, 0.25), rgba(233, 30, 99, 0.25))' }};
                  z-index: 0;
                  transition: clip-path 1s ease;
                }
                ha-card > * {
                  position: relative;
                  z-index: 1;
                }
          - type: custom:mushroom-template-card
            entity: sensor.neocikon_psram
            visibility:
              - condition: state
