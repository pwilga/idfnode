            icon: mdi:memory
            icon_color: >-
              {% set p = states('sensor.neocikon_psram') | float(0) %} {{ 'red' if p > 85
              else 'amber' if p > 60 else 'indigo' }}
            grid_options:
              columns: 12
              rows: auto
            card_mod:
              style: |
                ha-card {
                  position: relative;
                  overflow: hidden;
                }
                ha-card::before {
                  content: "";
                  position: absolute;
                  left: 0;
                  top: 0;
                  bottom: 0;
                  width: 100%;
                  clip-path: inset(0 {{ 100 - (states('sensor.neocikon_psram') | float(0)) }}% 0 0);
                  background: {% set p = states('sensor.neocikon_psram') | float(0) %}{{ 'linear-gradient(90deg, rgba(244, 67, 54, 0.25), rgba(233, 30, 99, 0.25))' if p > 85 else 'linear-gradient(90deg, rgba(255, 152, 0, 0.25), rgba(255, 193, 7, 0.25))' if p > 60 else 'linear-gradient(90deg, rgba(63, 81, 181, 0.25), rgba(33, 150, 243, 0.25))' }};
                  z-index: 0;
                  transition: clip-path 1s ease;
                }
                ha-card > * {
                  position: relative;
                  z-index: 1;
                }
          - type: custom:mushroom-template-card
            multiline_secondary: true
            primary: Bootlader
            secondary: >-
              {% if is_state('sensor.neocikon_bootloader_build_time',
              'unavailable') %}
              --
              {% else %}
              Build time: {{
              as_timestamp(states('sensor.neocikon_bootloader_build_time')) |
              timestamp_custom('%d.%m.%Y %H:%M') }}

              v:{{ state_attr('sensor.neocikon_bootloader_build_time','version')
              }} IDF: {{
              state_attr('sensor.neocikon_bootloader_build_time','idf') }}
              {% endif %}
            grid_options:
              columns: 6
              rows: auto
            color: yellow
            features_position: bottom
            icon: mdi:boom-gate-alert-outline
            entity: sensor.neocikon_bootloader_build_time
          - type: custom:mushroom-template-card
            multiline_secondary: true
            primary: Application
            secondary: >
              {% if is_state('sensor.neocikon_app_build_time', 'unavailable') %}
              --
              {% else %}
              Build time: {{
